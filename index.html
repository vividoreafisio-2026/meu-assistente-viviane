
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7851a9">
<meta name="description" content="Meu Assistente — organização pessoal e profissional.">
<title>Meu Assistente — Viviane Dorea</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">

<style>
:root{
  --roxo:#7851a9;--escuro:#503477;--lilas:#eee7f7;
  --fundo:#f8f6fa;--texto:#352c40;--cinza:#81798a;
  --borda:#e9e1f0;--branco:#fff;--verde:#e4f3e9;
  --amarelo:#fff3d8;--rosa:#f8e8eb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex}
aside{width:245px;background:linear-gradient(180deg,var(--roxo),var(--escuro));color:white;padding:24px 16px;flex-shrink:0}
.brand{padding:5px 12px 25px}
.brand h1{font-size:21px;margin:0 0 6px}
.brand p{font-size:12px;opacity:.8;margin:0}
nav{display:grid;gap:5px}
nav button{color:white;background:transparent;border:0;border-radius:10px;text-align:left;padding:12px;font-size:14px}
nav button:hover,nav button.active{background:#ffffff30}
.side-note{margin:35px 10px 0;font-size:11px;opacity:.7;line-height:1.6}
main{flex:1;min-width:0;padding:28px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:25px}
.topbar h2{margin:0;font-size:25px;color:var(--escuro)}
.today{color:var(--cinza);font-size:13px}
.content{max-width:1200px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:white;border:1px solid var(--borda);border-radius:16px;padding:20px;min-width:0;box-shadow:0 5px 22px #42275d0b}
.card h3{margin:0 0 15px;color:var(--escuro);font-size:16px}
.full{grid-column:1/-1}
.stat{font-size:27px;color:var(--roxo);font-weight:bold}
.muted{color:var(--cinza);font-size:13px}
.section-title{margin:25px 0 14px;color:var(--escuro)}
form{display:grid;gap:12px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:grid;gap:6px;font-size:13px;color:var(--cinza)}
input,select,textarea{width:100%;border:1px solid var(--borda);background:white;border-radius:9px;padding:11px;color:var(--texto);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--roxo)}
textarea{min-height:85px;resize:vertical}
.btn{background:var(--roxo);color:white;border:0;border-radius:9px;padding:11px 16px;font-weight:bold}
.btn:hover{background:var(--escuro)}
.btn.secondary{background:var(--lilas);color:var(--escuro)}
.btn.danger{background:var(--rosa);color:#a33d55}
.btn.small{padding:7px 10px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item{border-bottom:1px solid var(--borda);padding:12px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.item:last-child{border-bottom:0}
.item strong{display:block;font-size:14px;margin-bottom:4px}
.item small{color:var(--cinza);font-size:12px}
.tag{display:inline-block;background:var(--lilas);color:var(--escuro);border-radius:20px;padding:4px 9px;font-size:11px;margin:5px 4px 0 0}
.tag.high{background:var(--rosa);color:#a33d55}
.tag.medium{background:var(--amarelo);color:#8b641c}
.tag.low{background:var(--verde);color:#39734b}
.empty{color:var(--cinza);font-size:13px;padding:12px 0}
.progress{height:8px;background:var(--lilas);border-radius:20px;overflow:hidden;margin-top:8px}
.progress span{display:block;height:100%;background:var(--roxo)}
.checkline{display:flex;align-items:center;gap:8px}
.checkline input{width:auto}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day-name,.day{text-align:center;padding:9px 2px;font-size:12px}
.day-name{color:var(--cinza);font-weight:bold}
.day{min-height:62px;background:#f8f5fc;border-radius:8px;border:1px solid transparent;cursor:pointer}
.day:hover{border-color:var(--roxo)}
.day.today{border-color:var(--roxo);font-weight:bold}
.day.selected{background:var(--lilas)}
.day.has-event:after{content:"•";display:block;color:var(--roxo);font-size:18px;line-height:10px}
.day.blank{background:transparent;cursor:default}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
.tabs button{border:1px solid var(--borda);background:white;color:var(--escuro);padding:9px 14px;border-radius:9px}
.tabs button.active{background:var(--roxo);color:white;border-color:var(--roxo)}
.event-card{border-left:4px solid var(--roxo);background:#faf8fc;padding:12px;border-radius:8px;margin:8px 0}
.event-card.done{opacity:.6}
.event-card.done strong{text-decoration:line-through}
.event-card .event-top{display:flex;justify-content:space-between;gap:10px}
.event-card .event-meta{font-size:12px;color:var(--cinza);margin-top:5px}
.wheel-wrap{max-width:550px;margin:auto}
canvas{width:100%;max-width:500px;display:block;margin:auto}
.score-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.score-grid label{color:var(--texto)}
@media(max-width:850px){
 .app{display:block}aside{width:100%;padding:14px}
 .brand{padding:4px 5px 12px}nav{display:flex;overflow-x:auto;padding-bottom:4px}
 nav button{white-space:nowrap;padding:10px;font-size:12px}
 .side-note{display:none}main{padding:18px 13px 30px}
 .topbar h2{font-size:21px}.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
 .grid,.grid.three,.form-grid{grid-template-columns:1fr}
 .full{grid-column:auto}.card{padding:16px}
 .day{min-height:48px;font-size:11px}.score-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="app">
<aside>
  <div class="brand">
    <h1>Meu Assistente</h1>
    <p>Viviane Dorea · Organização em movimento</p>
  </div>
  <nav id="menu">
    <button class="active" data-page="inicio">⌂ Início</button>
    <button data-page="agenda">▦ Agenda</button>
    <button data-page="tarefas">✓ Tarefas</button>
    <button data-page="emocoes">♡ Emoções</button>
    <button data-page="roda">◉ Roda da Vida</button>
    <button data-page="consultorio">✚ Consultório</button>
    <button data-page="financeiro">R$ Financeiro</button>
    <button data-page="projetos">◇ Projetos</button>
    <button data-page="habitos">↗ Hábitos</button>
    <button data-page="diario">▤ Diário</button>
    <button data-page="backup">⇧ Backup</button>
  </nav>
  <div class="side-note">Seu espaço de organização pessoal e profissional.</div>
</aside>

<main>
  <div class="topbar">
    <h2 id="pageTitle">Início</h2>
    <span class="today" id="todayLabel"></span>
  </div>
  <div class="content" id="content"></div>
</main>
</div>

<script>
(() => {
"use strict";

const KEY="meuAssistente_v2";
const today=()=>new Date().toLocaleDateString("en-CA");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const blankData=()=>({
 tasks:[],emotions:[],wheel:[],finance:[],projects:[],
 habits:[],diary:[],appointments:[]
});

let data=blankData();
let page="inicio";
let selectedDate=today();
let calendarMonth=new Date();
let agendaMode="mes";
let agendaCategory="Todas";

function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function load(){
 try{
  const saved=JSON.parse(localStorage.getItem(KEY));
  if(saved&&typeof saved==="object")data={...blankData(),...saved};
 }catch(e){console.warn("Erro ao carregar dados",e)}
 data.tasks=data.tasks.map(t=>({...t,priority:t.priority||"Média",status:t.status||(t.done?"Concluída":"Pendente")}));
 data.appointments=data.appointments.map(a=>({...a,priority:a.priority||"Média",status:a.status||"Pendente",category:a.category||"Pessoal"}));
 migrateOldData();
}
function migrateOldData(){
 if(localStorage.getItem("meuAssistente_migracao_v2")==="ok")return;
 const importedTasks=new Set(data.tasks.map(t=>t.legacyId).filter(Boolean));
 const importedNotes=new Set(data.diary.map(d=>d.legacyId).filter(Boolean));
 for(let i=0;i<localStorage.length;i++){
  const key=localStorage.key(i);if(!key)continue;
  let m=key.match(/^meuAssistente_tarefas_(\d{4}-\d{2}-\d{2})$/);
  if(m){
   try{
    const old=JSON.parse(localStorage.getItem(key));
    if(Array.isArray(old))old.forEach((t,index)=>{
     const legacyId=key+"_"+index;if(importedTasks.has(legacyId))return;
     const title=typeof t==="string"?t:(t.text||t.nome||t.title||t.tarefa||"");
     if(title)data.tasks.push({id:uid(),legacyId,title,date:m[1],time:"",category:"Pessoal",priority:"Média",status:(t.done||t.concluida||t.completed)?"Concluída":"Pendente",done:!!(t.done||t.concluida||t.completed)});
    });
   }catch(e){}
  }
  m=key.match(/^meuAssistente_notas_(\d{4}-\d{2}-\d{2})$/);
  if(m&&!importedNotes.has(key)){
   const note=localStorage.getItem(key);
   if(note&&note.trim())data.diary.push({id:uid(),legacyId:key,date:m[1],title:"Anotação antiga",text:note});
  }
 }
 localStorage.setItem("meuAssistente_migracao_v2","ok");save();
}

const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dateBR=v=>{if(!v)return"";const[y,m,d]=v.split("-");return`${d}/${m}/${y}`};
const monthBR=d=>d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
const categories=["Pessoal","Profissional","Consultório","Estudos","Família","Projeto"];
const priorities=["Alta","Média","Baixa"];
const statuses=["Pendente","Em andamento","Concluída"];

function setPage(next){
 page=next;
 document.querySelectorAll("#menu button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
 const labels={inicio:"Início",agenda:"Agenda inteligente",tarefas:"Tarefas",emocoes:"Planejador emocional",roda:"Roda da Vida",consultorio:"Consultório",financeiro:"Financeiro",projetos:"Projetos",habitos:"Hábitos",diario:"Diário",backup:"Backup e segurança"};
 document.getElementById("pageTitle").textContent=labels[page]||"Meu Assistente";
 render();
}
function taskForm(){return `
<div class="card"><h3>Adicionar tarefa</h3><form id="taskForm">
<label>O que precisa ser feito?<input name="title" required placeholder="Digite sua tarefa"></label>
<div class="form-grid">
<label>Data<input type="date" name="date" value="${selectedDate}" required></label>
<label>Horário<input type="time" name="time"></label>
</div>
<div class="form-grid">
<label>Categoria<select name="category">${categories.map(c=>`<option>${c}</option>`).join("")}</select></label>
<label>Prioridade<select name="priority">${priorities.map(p=>`<option ${p==="Média"?"selected":""}>${p}</option>`).join("")}</select></label>
</div>
<label>Status<select name="status">${statuses.map(s=>`<option ${s==="Pendente"?"selected":""}>${s}</option>`).join("")}</select></label>
<button class="btn">Salvar tarefa</button>
</form></div>`}
function eventItems(items){
 if(!items.length)return`<p class="empty">Nenhum registro para este período.</p>`;
 return items.map(item=>{
  const isTask=item.kind==="task";
  const label=isTask?"Tarefa":"Compromisso";
  const done=item.status==="Concluída";
  const pr=item.priority||"Média";
  return `<div class="event-card ${done?"done":""}">
   <div class="event-top">
    <div><strong>${esc(item.title)}</strong>
    <div class="event-meta">${dateBR(item.date)} ${item.time?"· "+esc(item.time):""} · ${label}</div></div>
    <button class="btn danger small" data-action="delete" data-list="${isTask?"tasks":"appointments"}" data-id="${esc(item.id)}">Excluir</button>
   </div>
   <div><span class="tag">${esc(item.category||"Pessoal")}</span>
    <span class="tag ${pr==="Alta"?"high":pr==="Baixa"?"low":"medium"}">${esc(pr)}</span>
    <span class="tag">${esc(item.status||"Pendente")}</span>
   </div>
   <div class="actions" style="margin-top:9px">
    <select aria-label="Alterar status" data-action="changeStatus" data-kind="${isTask?"task":"appointment"}" data-id="${esc(item.id)}">
     ${statuses.map(s=>`<option ${item.status===s?"selected":""}>${s}</option>`).join("")}
    </select>
   </div>
  </div>`;
 }).join("");
}
function allEvents(){
 const tasks=data.tasks.map(t=>({...t,kind:"task",status:t.status||(t.done?"Concluída":"Pendente")}));
 const appointments=data.appointments.map(a=>({...a,kind:"appointment"}));
 return [...tasks,...appointments].sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
}
function filteredEvents(){
 return allEvents().filter(e=>agendaCategory==="Todas"||e.category===agendaCategory);
}
function calendarView(){
 const year=calendarMonth.getFullYear(),month=calendarMonth.getMonth();
 const first=new Date(year,month,1).getDay(),total=new Date(year,month+1,0).getDate();
 const events=allEvents();
 let html=`<div class="calendar-head">
 <button class="btn secondary small" data-action="prevMonth">‹</button>
 <strong>${esc(monthBR(calendarMonth))}</strong>
 <button class="btn secondary small" data-action="nextMonth">›</button>
 </div><div class="calendar">`;
 ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].forEach(d=>html+=`<div class="day-name">${d}</div>`);
 for(let i=0;i<first;i++)html+=`<div class="day blank"></div>`;
 for(let d=1;d<=total;d++){
  const date=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const has=events.some(e=>e.date===date);
  html+=`<div class="day ${date===today()?"today":""} ${date===selectedDate?"selected":""} ${has?"has-event":""}" data-action="selectDate" data-date="${date}">${d}</div>`;
 }
 return html+"</div>";
}
function weekDates(date){
 const d=new Date(date+"T12:00:00");
 const day=(d.getDay()+6)%7;
 d.setDate(d.getDate()-day);
 return Array.from({length:7},(_,i)=>{
  const x=new Date(d);x.setDate(d.getDate()+i);
  return x.toLocaleDateString("en-CA");
 });
}
function agendaPage(){
 const events=filteredEvents();
 let selected=[];
 let heading="";
 if(agendaMode==="dia"){
  selected=events.filter(e=>e.date===selectedDate);heading="Agenda de "+dateBR(selectedDate);
 }else if(agendaMode==="semana"){
  const days=weekDates(selectedDate);
  selected=events.filter(e=>days.includes(e.date));
  heading="Semana de "+dateBR(days[0])+" a "+dateBR(days[6]);
 }else{
  const month=selectedDate.slice(0,7);
  selected=events.filter(e=>e.date.startsWith(month));
  heading="Compromissos e tarefas de "+monthBR(new Date(selectedDate+"T12:00:00"));
 }
 return `<div class="grid">
 <div class="card">
  <h3>Calendário</h3>${calendarView()}
  <p class="muted">Os pontos indicam dias com tarefas ou compromissos. Selecione uma data para consultar.</p>
 </div>
 <div class="card"><h3>Novo compromisso</h3>
  <form id="appointmentForm">
   <label>Descrição<input name="title" required placeholder="Ex.: reunião, evento, consulta"></label>
   <div class="form-grid">
    <label>Data<input type="date" name="date" value="${selectedDate}" required></label>
    <label>Horário<input type="time" name="time"></label>
   </div>
   <div class="form-grid">
    <label>Categoria<select name="category">${categories.map(c=>`<option>${c}</option>`).join("")}</select></label>
    <label>Prioridade<select name="priority">${priorities.map(p=>`<option ${p==="Média"?"selected":""}>${p}</option>`).join("")}</select></label>
   </div>
   <label>Local ou observação<input name="place" placeholder="Local ou detalhe"></label>
   <button class="btn">Salvar compromisso</button>
  </form>
 </div>
 <div class="card full">
  <h3>Visualização da agenda</h3>
  <div class="tabs">
   <button data-action="agendaMode" data-mode="dia" class="${agendaMode==="dia"?"active":""}">Dia</button>
   <button data-action="agendaMode" data-mode="semana" class="${agendaMode==="semana"?"active":""}">Semana</button>
   <button data-action="agendaMode" data-mode="mes" class="${agendaMode==="mes"?"active":""}">Mês</button>
  </div>
  <div class="form-grid" style="margin-bottom:15px">
   <label>Data de referência<input type="date" id="agendaDate" value="${selectedDate}"></label>
   <label>Filtrar categoria<select id="agendaCategory">
    <option ${agendaCategory==="Todas"?"selected":""}>Todas</option>
    ${categories.map(c=>`<option ${agendaCategory===c?"selected":""}>${c}</option>`).join("")}
   </select></label>
  </div>
  <h3>${heading}</h3>${eventItems(selected)}
 </div>
 </div>`;
}
function taskList(filterDate=null){
 let tasks=[...data.tasks].filter(t=>!filterDate||t.date===filterDate);
 tasks.sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
 if(!tasks.length)return`<p class="empty">Nenhuma tarefa cadastrada.</p>`;
 return tasks.map(t=>`<div class="item">
 <div><div class="checkline"><input type="checkbox" data-action="taskDone" data-id="${esc(t.id)}" ${t.status==="Concluída"||t.done?"checked":""}>
 <strong>${esc(t.title)}</strong></div>
 <small>${dateBR(t.date)} ${t.time?"· "+esc(t.time):""}</small><br>
 <span class="tag">${esc(t.category)}</span>
 <span class="tag ${t.priority==="Alta"?"high":t.priority==="Baixa"?"low":"medium"}">${esc(t.priority||"Média")}</span>
 <span class="tag">${esc(t.status||"Pendente")}</span></div>
 <button class="btn danger small" data-action="delete" data-list="tasks" data-id="${esc(t.id)}">Excluir</button>
 </div>`).join("");
}
function home(){
 const pending=data.tasks.filter(t=>(t.status||"Pendente")!=="Concluída");
 const todayTasks=pending.filter(t=>t.date===today());
 const month=today().slice(0,7);
 const income=data.finance.filter(f=>f.type==="Entrada"&&f.date.startsWith(month)).reduce((s,f)=>s+Number(f.value),0);
 const expenses=data.finance.filter(f=>f.type==="Saída"&&f.date.startsWith(month)).reduce((s,f)=>s+Number(f.value),0);
 const upcoming=allEvents().filter(e=>e.date>=today()&&e.status!=="Concluída").slice(0,5);
 return `<div class="grid three">
 <div class="card"><h3>Tarefas pendentes</h3><div class="stat">${pending.length}</div><span class="muted">Em toda a agenda</span></div>
 <div class="card"><h3>Para hoje</h3><div class="stat">${todayTasks.length}</div><span class="muted">Tarefas abertas</span></div>
 <div class="card"><h3>Saldo do mês</h3><div class="stat">${money(income-expenses)}</div><span class="muted">Entradas menos saídas</span></div>
 </div>
 <h3 class="section-title">Minha organização</h3>
 <div class="grid">
 <div class="card"><h3>Tarefas de hoje</h3>${taskList(today())}<button class="btn secondary small" data-page="tarefas">Ver tarefas</button></div>
 <div class="card"><h3>Próximos eventos</h3>${eventItems(upcoming)}<button class="btn secondary small" data-page="agenda">Abrir agenda</button></div>
 </div>
 <h3 class="section-title">Meus projetos</h3><div class="card">${projectList()}</div>`;
}
function projectList(){
 if(!data.projects.length)return`<p class="empty">Você ainda não cadastrou projetos.</p>`;
 return data.projects.map(p=>`<div class="item"><div style="flex:1"><strong>${esc(p.name)}</strong><small>${esc(p.status||"Em andamento")}</small>
 <div class="progress"><span style="width:${Math.max(0,Math.min(100,Number(p.progress)||0))}%"></span></div>
 <small>${Number(p.progress)||0}% concluído</small></div>
 <button class="btn danger small" data-action="delete" data-list="projects" data-id="${esc(p.id)}">Excluir</button></div>`).join("");
}
function tasksPage(){return`<div class="grid">${taskForm()}
 <div class="card"><h3>Filtrar tarefas</h3><label>Data<input type="date" id="taskFilter" value="${selectedDate}"></label>
 <div class="actions" style="margin-top:12px"><button class="btn secondary small" data-action="clearTaskFilter">Ver todas</button></div></div>
 <div class="card full"><h3>Lista de tarefas</h3><div id="taskResults">${taskList()}</div></div></div>`}
function emotionSummary(){
 const list=data.emotions.filter(e=>e.date.startsWith(today().slice(0,7)));
 if(!list.length)return`<p class="empty">Ainda não há registros neste mês.</p>`;
 const avg=list.reduce((s,e)=>s+Number(e.intensity),0)/list.length;
 const counts={};list.forEach(e=>counts[e.emotion]=(counts[e.emotion]||0)+1);
 const common=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
 return`<p>Registros: <strong>${list.length}</strong></p><p>Intensidade média: <strong>${avg.toFixed(1)}/10</strong></p><p>Emoção mais registrada: <strong>${esc(common[0])}</strong></p>`;
}
function emotionPage(){return`<div class="grid">
 <div class="card"><h3>Como estou me sentindo hoje?</h3><form id="emotionForm">
 <label>Emoção<select name="emotion" required><option value="">Selecione</option>
 ${["Feliz","Tranquila","Grata","Motivada","Ansiosa","Triste","Cansada","Sobrecarregada","Irritada","Desanimada"].map(x=>`<option>${x}</option>`).join("")}</select></label>
 <label>Intensidade: <span id="intensityValue">5</span>/10<input type="range" name="intensity" min="1" max="10" value="5" id="intensity"></label>
 <label>O que influenciou meu dia?<textarea name="note"></textarea></label><button class="btn">Registrar emoção</button></form></div>
 <div class="card"><h3>Histórico</h3>${data.emotions.length?[...data.emotions].reverse().slice(0,12).map(e=>`<div class="item"><div><strong>${esc(e.emotion)} · ${e.intensity}/10</strong><small>${dateBR(e.date)}</small><p class="muted">${esc(e.note)}</p></div><button class="btn danger small" data-action="delete" data-list="emotions" data-id="${esc(e.id)}">Excluir</button></div>`).join(""):`<p class="empty">Seus registros aparecerão aqui.</p>`}</div>
 <div class="card full"><h3>Resumo do mês</h3>${emotionSummary()}</div></div>`}
const dimensions=["Saúde","Família","Relacionamentos","Carreira","Finanças","Desenvolvimento pessoal","Lazer","Espiritualidade"];
function wheelPage(){
 const last=data.wheel[data.wheel.length-1];
 return`<div class="grid"><div class="card"><h3>Minha avaliação</h3><p class="muted">Dê uma nota de 0 a 10 para cada dimensão.</p>
 <form id="wheelForm"><div class="score-grid">${dimensions.map((d,i)=>`<label>${d}<input type="number" name="score${i}" min="0" max="10" value="${last?last.scores[i]:5}" required></label>`).join("")}</div>
 <label>O que desejo melhorar?<textarea name="note"></textarea></label><button class="btn">Salvar avaliação</button></form></div>
 <div class="card"><h3>Minha Roda da Vida</h3>${last?`<p class="muted">Última avaliação: ${dateBR(last.date)}</p><div class="wheel-wrap"><canvas id="wheelCanvas" width="500" height="500"></canvas></div>`:`<p class="empty">Faça sua primeira avaliação.</p>`}</div>
 <div class="card full"><h3>Histórico</h3>${data.wheel.length?[...data.wheel].reverse().map(w=>`<div class="item"><div><strong>${dateBR(w.date)}</strong><small>Média: ${(w.scores.reduce((a,b)=>a+Number(b),0)/8).toFixed(1)}/10</small><p class="muted">${esc(w.note)}</p></div><button class="btn danger small" data-action="delete" data-list="wheel" data-id="${esc(w.id)}">Excluir</button></div>`).join(""):`<p class="empty">Nenhuma avaliação registrada.</p>`}</div></div>`;
}
function drawWheel(){
 const canvas=document.getElementById("wheelCanvas"),last=data.wheel[data.wheel.length-1];if(!canvas||!last)return;
 const ctx=canvas.getContext("2d"),cx=250,cy=245,radius=155,n=8;ctx.clearRect(0,0,500,500);ctx.font="12px Arial";
 for(let level=1;level<=10;level++){const r=radius*level/10;ctx.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.strokeStyle="#e6ddec";ctx.stroke()}
 for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+radius*Math.cos(a),cy+radius*Math.sin(a));ctx.strokeStyle="#d8c9e6";ctx.stroke()}
 ctx.beginPath();last.scores.forEach((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=radius*Number(s)/10;i?ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a)):ctx.moveTo(cx+r*Math.cos(a),cy+r*Math.sin(a))});
 ctx.closePath();ctx.fillStyle="rgba(120,81,169,.25)";ctx.fill();ctx.strokeStyle="#7851a9";ctx.lineWidth=3;ctx.stroke();
 last.scores.forEach((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,r=radius*Number(s)/10;ctx.beginPath();ctx.arc(cx+r*Math.cos(a),cy+r*Math.sin(a),4,0,Math.PI*2);ctx.fillStyle="#7851a9";ctx.fill();ctx.fillStyle="#503477";ctx.textAlign="center";ctx.fillText(dimensions[i],cx+(radius+34)*Math.cos(a),cy+(radius+34)*Math.sin(a))});
}
function financePage(){
 const month=today().slice(0,7),list=data.finance.filter(f=>f.date.startsWith(month));
 const income=list.filter(f=>f.type==="Entrada").reduce((s,f)=>s+Number(f.value),0),expense=list.filter(f=>f.type==="Saída").reduce((s,f)=>s+Number(f.value),0);
 return`<div class="grid three"><div class="card"><h3>Entradas</h3><div class="stat">${money(income)}</div></div><div class="card"><h3>Saídas</h3><div class="stat">${money(expense)}</div></div><div class="card"><h3>Saldo</h3><div class="stat">${money(income-expense)}</div></div></div>
 <h3 class="section-title">Lançamento financeiro</h3><div class="grid"><div class="card"><form id="financeForm">
 <label>Descrição<input name="description" required></label><div class="form-grid"><label>Tipo<select name="type"><option>Entrada</option><option>Saída</option></select></label><label>Valor<input name="value" type="number" min=".01" step=".01" required></label></div>
 <label>Data<input name="date" type="date" value="${today()}" required></label><label>Categoria<input name="category"></label><button class="btn">Salvar lançamento</button></form></div>
 <div class="card"><h3>Lançamentos do mês</h3>${list.length?[...list].reverse().map(f=>`<div class="item"><div><strong>${esc(f.description)}</strong><small>${dateBR(f.date)} · ${esc(f.category)}</small><br><span class="tag">${esc(f.type)} · ${money(f.value)}</span></div><button class="btn danger small" data-action="delete" data-list="finance" data-id="${esc(f.id)}">Excluir</button></div>`).join(""):`<p class="empty">Nenhum lançamento.</p>`}</div></div>`;
}
function projectPage(){return`<div class="grid"><div class="card"><h3>Novo projeto</h3><form id="projectForm">
 <label>Nome<input name="name" required></label><label>Etapa atual<input name="status"></label>
 <label>Progresso: <span id="progressValue">0</span>%<input type="range" min="0" max="100" value="0" name="progress" id="projectProgress"></label><button class="btn">Adicionar projeto</button></form></div>
 <div class="card"><h3>Meus projetos</h3>${projectList()}</div></div>`}
function habitsPage(){
 const list=data.habits.filter(h=>h.date===today());
 return`<div class="grid"><div class="card"><h3>Registrar hábito</h3><form id="habitForm"><label>Hábito<input name="name" required placeholder="Ex.: água, academia, leitura"></label><label>Data<input type="date" name="date" value="${today()}" required></label><button class="btn">Adicionar hábito</button></form></div>
 <div class="card"><h3>Hábitos de hoje</h3>${list.length?list.map(h=>`<div class="item"><label class="checkline"><input type="checkbox" data-action="habitDone" data-id="${esc(h.id)}" ${h.done?"checked":""}><strong>${esc(h.name)}</strong></label><button class="btn danger small" data-action="delete" data-list="habits" data-id="${esc(h.id)}">Excluir</button></div>`).join(""):`<p class="empty">Nenhum hábito cadastrado hoje.</p>`}</div>
 <div class="card full"><h3>Histórico</h3>${data.habits.length?[...data.habits].reverse().slice(0,30).map(h=>`<div class="item"><div><strong>${esc(h.name)}</strong><small>${dateBR(h.date)} · ${h.done?"Concluído":"Pendente"}</small></div></div>`).join(""):`<p class="empty">Seu histórico aparecerá aqui.</p>`}</div></div>`;
}
function diaryPage(){return`<div class="grid"><div class="card"><h3>Meu diário</h3><form id="diaryForm"><label>Data<input name="date" type="date" value="${today()}" required></label><label>Título<input name="title" placeholder="Como foi meu dia?"></label><label>Registro<textarea name="text" required></textarea></label><button class="btn">Salvar no diário</button></form></div>
 <div class="card"><h3>Meus registros</h3>${data.diary.length?[...data.diary].reverse().map(d=>`<div class="item"><div><strong>${esc(d.title||"Registro")}</strong><small>${dateBR(d.date)}</small><p class="muted">${esc(d.text)}</p></div><button class="btn danger small" data-action="delete" data-list="diary" data-id="${esc(d.id)}">Excluir</button></div>`).join(""):`<p class="empty">Seu diário ainda está vazio.</p>`}</div></div>`}
function officePage(){
 const office=data.tasks.filter(t=>t.category==="Consultório");
 return`<div class="grid"><div class="card"><h3>Organização do consultório</h3><p class="muted">Use a categoria Consultório ao cadastrar tarefas profissionais.</p><div class="stat">${office.filter(t=>t.status!=="Concluída").length}</div><span class="muted">Pendências</span><div style="margin-top:15px"><button class="btn" data-page="tarefas">Adicionar tarefa</button></div></div>
 <div class="card"><h3>Minhas pendências</h3>${office.length?taskListByArray(office):`<p class="empty">Nenhuma tarefa profissional.</p>`}</div>
 <div class="card full"><h3>Compromissos futuros</h3>${eventItems(allEvents().filter(e=>e.date>=today()&&e.category==="Consultório"))}</div></div>`;
}
function taskListByArray(tasks){return tasks.map(t=>`<div class="item"><div><strong>${esc(t.title)}</strong><small>${dateBR(t.date)} · ${esc(t.status||"Pendente")}</small></div><button class="btn danger small" data-action="delete" data-list="tasks" data-id="${esc(t.id)}">Excluir</button></div>`).join("")}
function backupPage(){return`<div class="grid"><div class="card"><h3>Exportar meus dados</h3><p class="muted">Crie uma cópia de segurança de todos os módulos.</p><button class="btn" data-action="export">Baixar backup</button></div>
 <div class="card"><h3>Restaurar backup</h3><p class="muted">A restauração substituirá os dados atuais.</p><label>Arquivo JSON<input type="file" id="restoreFile" accept=".json,application/json"></label><button class="btn secondary" data-action="restore">Restaurar arquivo</button></div>
 <div class="card full"><h3>Sobre seus dados</h3><p class="muted">Os registros ficam neste navegador e dispositivo. Não há sincronização automática. Faça backups periódicos. Evite armazenar dados identificáveis de pacientes.</p><button class="btn danger small" data-action="clearAll">Apagar todos os dados</button></div></div>`}
function render(){
 const views={inicio:home,agenda:agendaPage,tarefas:tasksPage,emocoes:emotionPage,roda:wheelPage,consultorio:officePage,financeiro:financePage,projetos:projectPage,habitos:habitsPage,diario:diaryPage,backup:backupPage};
 document.getElementById("content").innerHTML=(views[page]||home)();
 if(page==="roda")drawWheel();
 const intensity=document.getElementById("intensity");
 if(intensity)intensity.addEventListener("input",()=>document.getElementById("intensityValue").textContent=intensity.value);
 const progress=document.getElementById("projectProgress");
 if(progress)progress.addEventListener("input",()=>document.getElementById("progressValue").textContent=progress.value);
}
function formObject(form){return Object.fromEntries(new FormData(form).entries())}

document.getElementById("menu").addEventListener("click",e=>{
 const b=e.target.closest("[data-page]");if(b)setPage(b.dataset.page);
});
document.getElementById("content").addEventListener("click",e=>{
 const p=e.target.closest("[data-page]");if(p){setPage(p.dataset.page);return}
 const b=e.target.closest("[data-action]");if(!b)return;
 const a=b.dataset.action;
 if(a==="delete"){
  const list=b.dataset.list,id=b.dataset.id;
  if(Array.isArray(data[list])){data[list]=data[list].filter(x=>x.id!==id);save();render()}
 }
 if(a==="selectDate"){selectedDate=b.dataset.date;render()}
 if(a==="prevMonth"){calendarMonth.setMonth(calendarMonth.getMonth()-1);render()}
 if(a==="nextMonth"){calendarMonth.setMonth(calendarMonth.getMonth()+1);render()}
 if(a==="agendaMode"){agendaMode=b.dataset.mode;render()}
 if(a==="clearTaskFilter"){document.getElementById("taskFilter").value="";document.getElementById("taskResults").innerHTML=taskList()}
 if(a==="export")exportData();
 if(a==="restore")restoreData();
 if(a==="clearAll"&&confirm("Tem certeza? Todos os dados serão apagados. Faça um backup antes.")){data=blankData();save();render()}
});
document.getElementById("content").addEventListener("change",e=>{
 const el=e.target;
 if(el.dataset.action==="taskDone"){
  const t=data.tasks.find(x=>x.id===el.dataset.id);
  if(t){t.done=el.checked;t.status=el.checked?"Concluída":"Pendente";save();render()}
 }
 if(el.dataset.action==="habitDone"){
  const h=data.habits.find(x=>x.id===el.dataset.id);
  if(h){h.done=el.checked;save();render()}
 }
 if(el.dataset.action==="changeStatus"){
  const list=el.dataset.kind==="task"?data.tasks:data.appointments;
  const item=list.find(x=>x.id===el.dataset.id);
  if(item){item.status=el.value;if(el.dataset.kind==="task")item.done=el.value==="Concluída";save();render()}
 }
 if(el.id==="taskFilter")document.getElementById("taskResults").innerHTML=taskList(el.value||null);
 if(el.id==="agendaDate"){selectedDate=el.value;render()}
 if(el.id==="agendaCategory"){agendaCategory=el.value;render()}
});
document.getElementById("content").addEventListener("submit",e=>{
 e.preventDefault();const f=e.target,v=formObject(f);
 if(f.id==="taskForm")data.tasks.push({id:uid(),title:v.title.trim(),date:v.date,time:v.time,category:v.category,priority:v.priority,status:v.status,done:v.status==="Concluída"});
 if(f.id==="appointmentForm")data.appointments.push({id:uid(),title:v.title.trim(),date:v.date,time:v.time,category:v.category,priority:v.priority,status:"Pendente",place:v.place});
 if(f.id==="emotionForm")data.emotions.push({id:uid(),date:today(),emotion:v.emotion,intensity:Number(v.intensity),note:v.note});
 if(f.id==="wheelForm")data.wheel.push({id:uid(),date:today(),scores:dimensions.map((_,i)=>Math.max(0,Math.min(10,Number(v["score"+i])))),note:v.note});
 if(f.id==="financeForm")data.finance.push({id:uid(),description:v.description.trim(),type:v.type,value:Number(v.value),date:v.date,category:v.category});
 if(f.id==="projectForm")data.projects.push({id:uid(),name:v.name.trim(),status:v.status,progress:Number(v.progress)});
 if(f.id==="habitForm")data.habits.push({id:uid(),name:v.name.trim(),date:v.date,done:false});
 if(f.id==="diaryForm")data.diary.push({id:uid(),date:v.date,title:v.title,text:v.text});
 save();render();
});
function exportData(){
 const payload={app:"Meu Assistente — Viviane Dorea",version:2,exportedAt:new Date().toISOString(),data};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="meu-assistente-backup-"+today()+".json";a.click();URL.revokeObjectURL(url);
}
function restoreData(){
 const file=document.getElementById("restoreFile").files[0];
 if(!file){alert("Selecione um arquivo de backup.");return}
 if(!confirm("A restauração substituirá os dados atuais. Deseja continuar?"))return;
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   const parsed=JSON.parse(reader.result),incoming=parsed.data||parsed,restored=blankData();
   Object.keys(restored).forEach(k=>{if(Array.isArray(incoming[k]))restored[k]=incoming[k]});
   data=restored;save();alert("Backup restaurado com sucesso.");setPage("inicio");
  }catch(e){alert("Não foi possível ler esse arquivo de backup.")}
 };
 reader.readAsText(file);
}
document.getElementById("todayLabel").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});
load();render();
if("serviceWorker"in navigator){
 window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(e=>console.log("Service Worker:",e)));
}
})();
</script>
</body>
</html>
